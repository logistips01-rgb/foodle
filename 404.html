<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página no encontrada · Foodle</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
    <link href="/fuentes/inter.css" rel="stylesheet" />
    <style>
      :root { --bg: #f4f3f1; --card: #ffffff; --border: #e2dfdb; --text: #141414; --dim: #5f5b57; --accent: #d42f34; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
      main { max-width: 560px; margin: 0 auto; padding: 12vh 16px 60px; text-align: center; }
      .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 900; font-size: 32px; letter-spacing: -0.055em; color: var(--text); text-decoration: none; }
      .brand img { width: 34px; height: 34px; }
      h1 { font-size: clamp(24px,5vw,32px); letter-spacing: -0.03em; margin: 28px 0 8px; }
      p { color: var(--dim); margin: 0 0 24px; }
      form { display: flex; gap: 8px; }
      input { flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
      button, .btn { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 18px; background: var(--accent); color: #fff; text-decoration: none; cursor: pointer; }
      .links { margin-top: 20px; display: flex; gap: 16px; justify-content: center; }
      .links a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/"><img src="/img/logo.svg" alt="" />foodle</a>
      <h1>Esta página ya no existe</h1>
      <p>Puede que la ciudad o la categoría se haya quedado sin recomendaciones. Busca lo que te apetezca:</p>
      <form action="/" method="get"><input name="q" placeholder="Arroces en Valencia, tapas en Sevilla…" aria-label="Buscar" /><button>Buscar</button></form>
      <div class="links"><a href="/">Dónde comer</a><a href="/recetas/">Recetas</a></div>
    </main>
  </body>
</html>
