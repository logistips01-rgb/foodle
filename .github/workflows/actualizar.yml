name: actualizar

# Única tarea automática del repo: lee los foodies (API oficial de Meta), clasifica
# y guarda data/*.json. Una vez al día; también se puede lanzar a mano.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Publicaciones a leer por foodie (vacío = 15, o 50 si el foodie es nuevo)"
        default: ""

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # Si se llega al límite horario de la API, instagram.js espera y reintenta.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Leer, clasificar y geolocalizar
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: node foodle/actualizar.js ${{ inputs.max }}

      - name: Guardar datos
        run: |
          git config user.name "foodle-bot"
          git config user.email "foodle-bot@users.noreply.github.com"
          # data/ y lo que genera foodle/paginas.js: páginas por ciudad (/madrid/…) y sitemap.xml
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "datos: actualización diaria $(date -u +%F)"
          git push
